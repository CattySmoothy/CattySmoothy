{% extends "base.html" %}

{% block content %}
<div class="about-layout" style="justify-content: center;">
    <div class="about-box" style="max-width: 420px;">
        <section class="support-header">
            <div class="content-container">
                <h1 class="page-title">Log In</h1>
                <p class="page-subtitle">Welcome back</p>
            </div>
        </section>

        <form class="donate-form" id="loginForm">
            <div class="donate-field">
                <label class="donate-label" for="loginEmail">Email</label>
                <input type="email" id="loginEmail" class="donate-input" placeholder="you@example.com" required>
            </div>

            <div class="donate-field">
                <label class="donate-label" for="loginPassword">Password</label>
                <input type="password" id="loginPassword" class="donate-input" placeholder="Your password" required>
            </div>

            <div id="loginError" style="display:none; color:#c0392b; font-size:0.85em; margin-bottom:12px;"></div>

            <button type="submit" class="plan-button donate-submit">Log In</button>
            <p class="donate-note" style="margin-top:14px; text-align:center;">
                Don't have an account? <a href="{{ url_for('register', next=next) }}">Create one</a>
            </p>
        </form>
    </div>
</div>

<script>
document.getElementById('loginForm').addEventListener('submit', function(e) {
    e.preventDefault();
    var email = document.getElementById('loginEmail').value;
    var password = document.getElementById('loginPassword').value;
    var errorBox = document.getElementById('loginError');
    errorBox.style.display = 'none';

    var btn = this.querySelector('.donate-submit');
    btn.textContent = 'Logging In...';
    btn.disabled = true;

    fetch('/login{{ ('?next=' + next) if next else '' }}', {
        method: 'POST',
        headers: {
            'Content-Type': 'application/json',
            'X-CSRFToken': document.querySelector('meta[name="csrf-token"]').content
        },
        body: JSON.stringify({
            email: email,
            password: password
        })
    })
    .then(function(r) { return r.json(); })
    .then(function(data) {
        if (data.redirect) {
            window.location.href = data.redirect;
        } else {
            errorBox.textContent = data.error || 'Something went wrong';
            errorBox.style.display = '';
            btn.textContent = 'Log In';
            btn.disabled = false;
        }
    })
    .catch(function() {
        errorBox.textContent = 'Could not connect to the server.';
        errorBox.style.display = '';
        btn.textContent = 'Log In';
        btn.disabled = false;
    });
});
</script>
{% endblock %}
